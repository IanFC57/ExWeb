<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background-color: #f0f0f0; }
        .lista {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        .usuario {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .Img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        .infos {
            display: flex;
            flex-direction: column;
        }
        .nome { font-weight: bold; color: #333; margin: 0 0 5px 0; }
        .endereco { color: #888; font-size: 0.85em; margin: 0; }
    </style>
</head>
<body>
    <div class="lista">
        <div class="usuario">
            <img src="img/attractive-beautiful-young-woman-taking-selfie-sexy-outdoors-90531885.webp" class="Img">
            <div class="infos">
                <p class="nome">Linda Hart</p>
                <p class="endereco">6765 Shady Ln Dr</p>
            </div>
        </div>
        <div class="usuario">
            <img src="img/handsome-caucasian-man-taking-selfie-portrait-indoor-home-happy-guy-smiling-camera-lifestye-concept-280800553.webp"  class="Img">
            <div class="infos">
                <p class="nome">Roger Medina</p>
                <p class="endereco">2420 Paddock Way</p>
            </div>
        </div>
        <div class="usuario">
            <img src="img/handsome-man-taking-selfie-young-41333979.webp"  class="Img">
            <div class="infos">
                <p class="nome">Dean Sullivan</p>
                <p class="endereco">6727 Airplane Ave</p>
            </div>
        </div>
        <div class="usuario">
            <img src="img/1000_F_545067217_r6FePteKU4pn1A237c6LUTxykCsVhAce.jpg" alt="Elizabeth" class="Img">
            <div class="infos">
                <p class="nome">Elizabeth Austin</p>

            </div>
        </div>
    </div>
</body>
</html>
