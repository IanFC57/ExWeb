<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .container{
            display: grid;
            grid-template-areas: "header header header" "main empty sidebar" "footer footer footer";
            height: 100vh;
        }

        @media (max-width:700px) {
            .container{
            display: grid;
            grid-template-areas: "header" "main" "empty" "sidebar" "footer";
            height: 100vh;
        }

        }



        .box{border: 1px solid black; text-align: center;}
        #box1{grid-area: header; background-color: orange;}
        #box2{grid-area: main; background-color: blue;}
        #box3{grid-area: empty; background-color: white;}
        #box4{grid-area: sidebar; background-color: red;}
        #box5{grid-area: footer; background-color: green;}




    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
        <div class="box" id="box5">5</div>
    </div>
    
</body>
</html>
