<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 250px 1fr;            
            grid-template-rows: 80px 1fr 80px;           
            grid-template-areas: 
                "header header" 
                "nav content" 
                "footer footer";  
            min-height: 100vh; 
        }

        .box {
            border: 1px solid black; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-family: sans-serif;
        }
 
        #box1 { grid-area: header; background-color: #d8457c; }
        #box2 { grid-area: nav; background-color: #b5b780; }
        #box3 { grid-area: content; background-color: #e5ad85; } 
        #box4 { grid-area: footer; background-color: #5ea894; }

    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">Header</div>
        <div class="box" id="box2">Nav</div>
        <div class="box" id="box3">Content</div>
        <div class="box" id="box4">Footer</div>
    </div>
    
</body>
</html>
