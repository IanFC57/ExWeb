<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 3 - Mosaico Flexbox</title>
    <style>
        .container {
            display: flex;
            gap: 10px;
            width: 800px;
            height: 500px;
            margin: 20px auto;
            padding: 10px;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .box { border-radius: 4px; }
        
        /* Bloco Esquerdo (contém Laranja, Azul, Rosa, Amarelo) */
        .left-section {
            display: flex; flex-direction: column; gap: 10px; flex: 2;
        }
        .left-top { display: flex; gap: 10px; flex: 2; }
        .left-top-col { display: flex; flex-direction: column; gap: 10px; flex: 1.2; }
        
        .box-orange { background-color: #fca33a; flex: 1.5; }
        .box-blue { background-color: #a7c1e3; flex: 1; }
        .box-pink { background-color: #f3bca8; flex: 1; }
        .box-yellow { background-color: #fcbf38; flex: 1; }

        /* Bloco Direito (contém Azul claro, Verde, Círculos) */
        .right-section {
            display: flex; flex-direction: column; gap: 10px; flex: 1;
        }
        .box-lightblue { background-color: #c9e2de; flex: 1; }
        .right-bottom { display: flex; gap: 10px; flex: 2; }
        .box-green { background-color: #b5ce6e; flex: 2; }
        
        .circles-col {
            display: flex; flex-direction: column; justify-content: space-around; align-items: center; flex: 0.5;
        }
        .circle { width: 40px; height: 40px; border-radius: 50%; }
        .c1 { background-color: #f1a070; }
        .c2 { background-color: #d1b1c2; }
        .c3 { background-color: #bdcc9e; }
        .c4 { background-color: #c2c0e3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="left-top">
                <div class="left-top-col">
                    <div class="box box-orange"></div>
                    <div class="box box-blue"></div>
                </div>
                <div class="box box-pink"></div>
            </div>
            <div class="box box-yellow"></div>
        </div>
        <div class="right-section">
            <div class="box box-lightblue"></div>
            <div class="right-bottom">
                <div class="box box-green"></div>
                <div class="circles-col">
                    <div class="circle c1"></div>
                    <div class="circle c2"></div>
                    <div class="circle c3"></div>
                    <div class="circle c4"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
