<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0%;}
        body{height: 100vh;}

        .box{border: 1px solid black;text-align: center;}

        #box1{background-color: blue;height: 230px;}
        
        #box2{background-color: green;height: 230px;}

        #box3{background-color: red;height: 230px;}

        #box4{background-color: yellow;height: 230px;}
    </style>
</head>
<body>
    <div id="box1" class="box">1</div>
    <div id="box2" class="box">2</div>
    <div id="box3" class="box">3</div>
    <div id="box4" class="box">4</div>
    
</body>
</html>
