<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
    
        body {
          min-height: 100vh;
          background-color: #f5f5f5;
          padding: 20px;
          font-family: Georgia, serif;
        }
    

        .content {
          display: grid;
          grid-template-columns: repeat(12, 1fr);
          grid-template-rows: 1fr 2.5fr;
          gap: 20px;
          min-height: calc(100vh - 40px); 
        }
    
        .bloco {
          background-color: #404040;
          color: #ffffff;
          border-radius: 8px;
          padding: 20px;
          font-size: 1.5rem;
        }
    
        .bloco-a {
          grid-column: 1 / 6;
        }
    
        .bloco-b {
          grid-column: 11 / 13;
        }
    
        .bloco-c {
          grid-column: 1 / 4;
        }
    
        .bloco-d {
          grid-column: 4 / 13; 
          display: grid;
          grid-template-columns: 1fr 2fr 1fr;
          grid-template-rows: 1fr 1fr;
          gap: 15px;
          padding: 15px; 
        }
    
        .bloquinho {
          background-color: #cccccc;
          color: #333333;
          border-radius: 6px;
          padding: 20px;
          font-size: 1.5rem;
          display: flex;
          align-items: center; 
        }
      </style>
</head>
<body>
    <div class="content">
        <div class="bloco bloco-a">A</div>
        <div class="bloco bloco-b">B</div>
        <div class="bloco bloco-c">C</div>
        <div class="bloco bloco-d">

          <div class="bloquinho">E</div>
          <div class="bloquinho">F</div>
          <div class="bloquinho">G</div>
          <div class="bloquinho">M</div>
          <div class="bloquinho">I</div>
          <div class="bloquinho">J</div>
          
        </div>
      </div>
</body>
</html>
