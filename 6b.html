<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6b</title>
  <style>
        .content{
            margin: 0;
            padding: 10px;
            background-color: whitesmoke;
        }
        
        
        
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 10px;
            height: 95vh;
        }

        

        .box{
            border-radius: 5px;
            padding: 20px;
        }
       
        .laranja{background-color: orange;}
        .rosa{background-color: pink; grid-row: span 2;}
        .azul-claro{background-color: lightblue;}
        .azul{background-color: blue;}
        .verde{background-color: lightgreen; grid-row: span 2;}
        .amarelo{background-color: yellow; grid-column: span 2;} 
         
        
        .bolinhas {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; 
            align-items: center; 
            grid-column: 4;
            grid-row: 2 / span 2; 
        }

        .bolinhas div{
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }

        
        .bola1{background-color: orange;}
        .bola2{background-color: pink;}
        .bola3{background-color: yellowgreen;}
        .bola4{background-color: purple;}

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr; 
                height: auto; 
                grid-auto-rows: minmax(120px, auto); 
            }

            .rosa, .verde {
                grid-row: auto;
            }
            .amarelo {
                grid-column: auto;
            }
            
            .bolinhas {
                grid-column: auto;
                grid-row: auto;
                gap: 15px; 
                padding: 20px 0;
            }
        }
    </style>
</head>
<body>
  <div class="content">
        <div class="container">
        <div class="box laranja"></div>
        <div class="box rosa"></div>
        <div class="box azul-claro"></div>
        <div class="box azul"></div>
        <div class="box amarelo"></div>
        <div class="box verde"></div>

        <div class="bolinhas">
            <div class="bola1"></div>
            <div class="bola2"></div>
            <div class="bola3"></div>
            <div class="bola4"></div>
        </div>
        
    </div>
    </div>
  
</body>
</html>
