<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <Style>
        #coracao{
            display: inline-block;
            font-size: 100px;
            animation: voar 1s linear 0s infinite;


        }
        @keyframes voar{
            0%{font-size: 1px;
                transform: rotate(0deg);
            }

            100%{font-size: 100px;
                transform: rotate(360deg);            
            };
        }


    </Style>
</head>
<body>
    <span id="coracao">❤️</span>
    
    
</body>
</html>
