<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <Style>
        #coracao{
            display: inline-block;
            font-size: 100px;
            animation: voar 1s linear 0s infinite;


        }
        #foguete{
            position: fixed;
            bottom: 0px;
            left: 0px;
            font-size: 100px;
            transform: rotate(-45deg);
            animation: lancamento 10s ease-in infinite;

        }
        @keyframes voar{
            0%{font-size: 1px;
                transform: rotate(0deg);
            }

            100%{font-size: 100px;
                transform: rotate(360deg);            
            };

             
        }
        @keyframes lancamento{
            0%{}
            40%{
                transform: rotate(0deg);
            }
            50%{
                left: 50vh;
                transform: rotate(-60deg);
            }
            100%{
                transform: rotate(-45deg);
                bottom: 100vh;
            }
        }

    </Style>
</head>
<body>
    <span id="coracao">❤️</span>
    <span id="foguete">🚀</span>

    
</body>
</html>
