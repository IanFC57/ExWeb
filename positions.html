<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{border: 1px solid red;margin: 0%; padding: 20px;}
        .box{display:inline-block;width: 100px;border-color: black;}
        #box1{background-color: aqua;position: relative;top: 10px;left: 150px;}
        #box2{background-color: beige;position: relative;top: 200px;}
        #box3{background-color: blue}
        #box4{background-color: blueviolet;}
        #box5{background-color: chocolate;}
        span:last-child{background-color: brown;}
    </style>
</head>\    
<body>
    <div id="Container">
        <div id="box1" class="box">1</div>
        <div id="box2" class="box">2</div>
        <div id="box3" class="box">3</div>
        <div id="box4" class="box">4</div>
        <div id="box5" class="box">5</div>
        <span class="box">6</span>
    
        
        

    </div>
    
</body>
</html>
