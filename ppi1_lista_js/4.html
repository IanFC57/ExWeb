<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4</title>
</head>
<body>
    <div class="container">
        <h1>Calculadora de IMC</h1>
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" placeholder="Ex: João Silva"><br>
        <label for="peso">Peso (kg):</label><br>
        <input type="number" id="peso" step="0.1" placeholder="Ex: 75.5"><br>
        <label for="altura">Altura (m):</label><br>
        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75"><br>
        
        <button onclick="calcularIMC()">Calcular Perfil de Saúde</button>

        <p id="resultadoIMC"></p><br>
        <p id="classificacao"></p><br>
        <div class="imagem-container"><br>
            <img id="imgPerfil" width="250" alt="Perfil de Saúde" style="display: none;">
        </div>
    </div>

    <script>
        function calcularIMC() {
            var nomeInput = document.getElementById("nome").value.trim();
            var pesoInput = document.getElementById("peso").value;
            var alturaInput = document.getElementById("altura").value;

            if (nomeInput === "" || pesoInput === "" || alturaInput === "") {
                alert("Por favor, preencha o nome, o peso e a altura antes de calcular o IMC.");
                return;
            }

            var peso = parseFloat(pesoInput);
            var altura = parseFloat(alturaInput);

            var imc = peso / (altura * altura);

            var classificacaoTexto = "";

            if (imc < 18.5) {
                classificacaoTexto = "Abaixo do peso";
            } else if (imc >= 18.5 && imc < 24.9) {
                classificacaoTexto = "Peso normal";
            } else if (imc >= 25 && imc < 29.9) {
                classificacaoTexto = "Sobrepeso";
            } else if (imc >= 30 && imc < 34.9) {
                classificacaoTexto = "Obesidade grau 1";
            } else if (imc >= 35 && imc < 39.9) {
                classificacaoTexto = "Obesidade grau 2";
            } else { 
                classificacaoTexto = "Obesidade grau 3 (mórbida)";
            }

            var imcArredondado = Math.floor(imc);
            var imagemNome = "";

            switch (true) {
                case (imcArredondado < 18):
                    imagemNome = "Img/abaixopeso.png"; 
                    break;
                case (imcArredondado >= 18 && imcArredondado <= 24):
                    imagemNome = "Img/normal.png";
                    break;
                case (imcArredondado >= 25 && imcArredondado <= 29):
                    imagemNome = "Img/sobrepeso.png";
                    break;
                case (imcArredondado >= 30 && imcArredondado <= 34):
                    imagemNome = "Img/obesidade1.png";
                    break;
                case (imcArredondado >= 35 && imcArredondado <= 39):
                    imagemNome = "Img/obesidade2.png";
                    break;
                default: 
                    imagemNome = "Img/obesidade3.png";
                    break;
            }

            document.getElementById("resultadoIMC").innerText = nomeInput + ", seu IMC calculado é: " + imc.toFixed(2);
            document.getElementById("classificacao").innerText = "Classificação: " + classificacaoTexto;

            var imgPerfilElement = document.getElementById("imgPerfil");
            imgPerfilElement.src = imagemNome;
            imgPerfilElement.style.display = "inline-block"; 
        }
    </script>
</body>
</html>
