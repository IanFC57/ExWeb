<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
        }
        .calculadora {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .botoes {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            margin-top: 10px;
        }
        button {
            width: 50px;
            height: 50px;
            font-size: 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="calculadora">
        <h2>Calculadora</h2>
        
        <input type="number" id="num1" placeholder="Primeiro número">
        <input type="number" id="num2" placeholder="Segundo número">
        
        <div class="botoes">
            <button onclick="calcular('+')">+</button>
            <button onclick="calcular('-')">−</button>
            <button onclick="calcular('*')">×</button>
            <button onclick="calcular('/')">÷</button>
        </div>
        
        <p id="resultado">Resultado: </p>
    </div>

    <script>
        function calcular(operacao) {
            var n1 = parseFloat(document.getElementById("num1").value);
            var n2 = parseFloat(document.getElementById("num2").value);
            var resultadoFinal = 0;

            if (isNaN(n1) || isNaN(n2)) {
                alert("Por favor, digite os dois números!");
                return;
            }

            if (operacao === '+') {
                resultadoFinal = n1 + n2;
            } else if (operacao === '-') {
                resultadoFinal = n1 - n2;
            } else if (operacao === '*') {
                resultadoFinal = n1 * n2;
            } else if (operacao === '/') {
                if (n2 === 0) {
                    alert("Não é possível dividir por zero!");
                    return;
                }
                resultadoFinal = n1 / n2;
            }

            document.getElementById("resultado").innerHTML = "Resultado: " + resultadoFinal;
        }
    </script>
    
</body>
</html>
