<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11</title>
</head>
<body>
  <button id="alertButton">Clique aqui</button>
  <input type="text" id="textInput" placeholder="Digite algo">
  <div id="hoverDiv">Passe o mouse aqui</div>
  <select id="colorSelect">
    <option value="">Escolha uma cor</option>
    <option value="blue">Azul</option>
    <option value="green">Verde</option>
    <option value="red">Vermelho</option>
  </select>

  <script>
    let botaoAlert = document.getElementById("alertButton");

    botaoAlert.addEventListener("click", function() {
        alert("Mensagem de alerta na tela!");
    });

    let campoTexto = document.getElementById("textInput");

    campoTexto.addEventListener("keydown", function(event) {
        console.log(event.key);
    });

    campoTexto.addEventListener("focus", function() {
        campoTexto.style.backgroundColor = "yellow";
    });

    campoTexto.addEventListener("blur", function() {
        campoTexto.style.backgroundColor = "";
    });

    let divMouse = document.getElementById("hoverDiv");

    divMouse.addEventListener("mouseover", function() {
        divMouse.style.backgroundColor = "orange";
        divMouse.innerHTML = "O mouse está aqui";
    });

    divMouse.addEventListener("mouseout", function() {
        divMouse.style.backgroundColor = "";
        divMouse.innerHTML = "Passe o mouse aqui";
    });

    let selecionarCor = document.getElementById("colorSelect");

    selecionarCor.addEventListener("change", function() {
        document.body.style.backgroundColor = selecionarCor.value;
    });
  </script>
</body>
</html>
