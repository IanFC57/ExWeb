<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .titulo {
            display: flex;
            align-items: center;
            justify-content: center;
            color: gray; 
            font-size: 1.2rem;
            font-weight: normal;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        .Container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px; 
            min-height: calc(100vh - 130px); 
            padding-bottom: 40px;
        }

        .box {
            background-color: gray; 
            width: 80%; 
            
            height: 40px;
            border-radius: 5px; 
        }

        .container2 {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 20px;              
            margin-top: auto;       
            width: 100%;
        }

        .bola {
            width: 100px;
            height: 100px;
            background-color: gray;
            border-radius: 50%;
        }

        .box2 {
            background-color: gray;
            width: 1000px;
            height: 30px;
            border-radius: 5px;
        }

    </style>
</head>
<body class="Body">
    <h1 class="titulo">Company Logo</h1>
    
    <div class="Container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

        <div class="container2">
            <div class="bola"></div>
            <div class="box2"></div>
        </div>
    </div>
</body>
</html>
